    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo" aria-label="На главную">
                <span class="logo__icon"></span>
                <span class="logo__text">ECHO</span>
            </a>

            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Главная</a></li>
                    <li><a href="artists.html" class="nav__link">Артисты</a></li>

            </nav>

    <main class="main">
        <div class="container">


            <a href="backstage.html" class="back">← все задания</a>
            <h1>Рисунок на CSS</h1>

            <section class="bio">
                <h2 class="bio__title">О задании</h2>
                <p>Рисунок, созданный с помощью стилевой таблицы pic.css.</p>
            </section>


            <section class="task-demo">
                <div class="pic-frame">
                    <div class="pic">
                        <div class="rings-up"></div>
                        <div class="rings-right"></div>
                        <div class="rings-left"></div>

                        <div class="window">
                            <div class="sun"></div>
                        </div>

                        <div class="teapot">
                            <div class="teapot-top"></div>
                            <div class="teapot-cap"></div>
                            <div class="teapot-nose"></div>
                            <div class="teapot-handle"></div>
                            <div class="teapot-body"></div>
                        </div>

                        <div class="table">
                            <div class="table-countertop"></div>
                            <div class="table-foot"></div>
                            <div class="table-bottom"></div>
                        </div>

                        <div class="chair chair-left">
                            <div class="chair-back"></div>
                            <div class="chair-sit"></div>
                            <div class="chair-leg"></div>
                            <div class="chair-pattern"></div>
                        </div>

                        <div class="chair chair-right">
                            <div class="chair-back"></div>
                            <div class="chair-sit"></div>
                            <div class="chair-leg"></div>
                            <div class="chair-pattern"></div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>
